# 第 3 层 · 代理开发 —— 全仓库唯一的代理执行入口。
#
# 三类触发：
#   1. issue 打 fix-me 标签       → 代理实现该 issue，从 claude/ 分支开 PR
#   2. issue/PR 评论 @claude      → 代理响应评论（在 PR 上可直接推提交到源分支）
#   3. workflow_dispatch 带指令    → 机器/手动入口（自愈评论以外的定制任务）
#
# 成本治理：所有触发先过 ai-gate.yml（策略见 .github/ai-policy.yml）——
# 非谷时/超预算的触发会被排队（ai-queue）或拒绝，谷时由 ai-dispatcher.yml 批量唤醒。
#
# 架构约定（README「五层架构」）：自愈、巡检不直接跑代理，
# 而是发评论/建 issue 唤起本 workflow —— 日后换代理只改这一个文件。
name: Claude Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      instruction:
        description: 任务指令（可引用编号，如「修复 #12 描述的问题」）
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # Claude GitHub App 认证路径所需
  actions: read # 允许代理读取 CI 结果 + 闸门读取当日用量

# 触发守卫：只在有明确入口时运行（fix-me 标签需要仓库写权限才能打，
# 天然挡住外部注入；@claude 评论同样要求写权限，action 内置访问控制）。
# 注意 job 级 if 不能用 env 上下文，gate/agent 两个 job 各写一份完整条件。
jobs:
  gate:
    if: >-
      ${{
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
        github.event_name == 'workflow_dispatch'
      }}
    uses: ./.github/workflows/ai-gate.yml
    with:
      # 事件 → 触发类型：dispatch / fix_me / ci_autofix（自愈评论带标记）/ mention
      trigger: >-
        ${{
          github.event_name == 'workflow_dispatch' && 'dispatch' ||
          (github.event_name == 'issues' && 'fix_me') ||
          (contains(github.event.comment.body || github.event.review.body || '', '(ci-auto-fix') && 'ci_autofix') ||
          'mention'
        }}
      # urgent 标签直通闸门（只在 issue 类事件上读取标签，避免空引用）
      urgent: >-
        ${{
          (github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          contains(github.event.issue.labels.*.name, 'urgent')
        }}
      target_kind: ${{ github.event_name == 'workflow_dispatch' && 'none' || 'issue' }}
      target_number: ${{ github.event.issue.number || 0 }}

  agent:
    needs: gate
    if: >-
      ${{
        needs.gate.outputs.decision == 'allow' &&
        (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
          (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 运行 Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # —— 模型认证（当前：C · 第三方 Anthropic 兼容端点，三件套缺一不可）——
          # anthropic_api_key   满足 action 启动校验（值即端点密钥，兼作凭据）
          # ANTHROPIC_BASE_URL  请求重定向到兼容端点
          # ANTHROPIC_AUTH_TOKEN Bearer 认证（CLI 中优先于 api_key）
          anthropic_api_key: ${{ secrets.LLM_API_KEY }}
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ secrets.LLM_BASE_URL }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.LLM_API_KEY }}"
              }
            }
          # 若端点不认 claude 系模型名：Settings → Variables 配 LLM_MODEL（如 glm-4.6），
          # 并给上面 env 加一行 "ANTHROPIC_MODEL": "${{ vars.LLM_MODEL }}"
          #
          # 换认证方式时删除上面整段，改用：
          # A. Anthropic 官方 API：anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # B. 订阅（Pro/Max 本地 `claude setup-token`）：claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # GitHub 身份：用 PAT 让代理以你的身份开 PR —— GITHUB_TOKEN 开的 PR
          # 不会触发 CI，「CI 绿才合并」的分级策略会卡死。没配 PAT 时自动退回
          # GITHUB_TOKEN，交互功能仍可用，仅代理 PR 缺 CI。
          github_token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

          label_trigger: fix-me

          # 机器入口（workflow_dispatch）的任务指令；交互触发时为空，
          # action 自动进入对话/issue 实现模式
          prompt: ${{ github.event.inputs.instruction }}

          # 成本护栏：单次最大轮次由闸门按峰/谷动态给出（ai-policy.yml）
          claude_args: --max-turns ${{ needs.gate.outputs.max_turns }}
