# 可选层 · AI PR 审查 —— 给 PR 打 review-this 标签即触发分级审查。
#
# 与代理开发分离：审查不自动改代码，只输出分级评论
# （🔴 必须修复 / 🟡 建议 / 🔵 可选），行内问题用行内评论指出。
# 模型认证方式与 claude-agent.yml 保持一致（三选一，见 README「配置密钥」）。
# 成本治理：先过 ai-gate.yml（policy_review），非允许窗口自动排队到谷时。
#
# 已知边界：fork PR 的 token 只读，审查仅对本仓库分支开的 PR 生效。
name: PR AI Review

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  gate:
    if: github.event.label.name == 'review-this'
    uses: ./.github/workflows/ai-gate.yml
    with:
      trigger: review
      urgent: ${{ contains(github.event.pull_request.labels.*.name, 'urgent') }}
      target_kind: pr
      target_number: ${{ github.event.pull_request.number }}

  review:
    needs: gate
    if: github.event.label.name == 'review-this' && needs.gate.outputs.decision == 'allow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 模型端点解析：与 claude-agent.yml 同步维护（读同一个 ai-providers.yml）
      - name: 解析模型端点
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          p() { grep -E "^$1:" .github/ai-providers.yml | head -1 | cut -d':' -f2- | awk -F'#' '{print $1}' | tr -d ' "'; }
          P=$(p active)
          echo "ANTHROPIC_BASE_URL=$(p "${P}_base_url")" >> "$GITHUB_ENV"
          echo "ANTHROPIC_AUTH_TOKEN=$LLM_API_KEY" >> "$GITHUB_ENV"
          M=$(p "${P}_model")
          if [[ -n "$M" ]]; then echo "ANTHROPIC_MODEL=$M" >> "$GITHUB_ENV"; fi
          S=$(p "${P}_small_model")
          if [[ -n "$S" ]]; then
            echo "ANTHROPIC_SMALL_FAST_MODEL=$S" >> "$GITHUB_ENV"
            echo "ANTHROPIC_DEFAULT_HAIKU_MODEL=$S" >> "$GITHUB_ENV"
          fi

      - name: 运行 Claude 审查
        uses: anthropics/claude-code-action@v1
        with:
          # 认证：api_key 过启动校验；端点/模型由「解析模型端点」注入（同 claude-agent.yml）
          anthropic_api_key: ${{ secrets.LLM_API_KEY }}

          github_token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            审查这个 PR（PR 分支已检出到当前目录）。按严重程度分级输出：

            🔴 必须修复 —— 正确性 / 安全 / 会导致 CI 红的问题
            🟡 建议 —— 可维护性、测试缺失、偏离 AGENTS.md 规范
            🔵 可选 —— 风格与微小优化

            某个等级没有发现时，明确写「无」。摘要一条评论给出，具体代码问题用行内评论。

            Use `gh pr comment` for the summary.
            Use mcp__github_inline_comment__create_inline_comment (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
